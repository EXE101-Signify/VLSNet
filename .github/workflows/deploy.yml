name: Verify and deploy VSLNet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vslnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify inference assets are present
        run: |
          test -s checkpoint/best_v1.pth
          test -s dataset/root/gloss.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path
          checkpoint = Path('checkpoint/best_v1.pth')
          assert checkpoint.stat().st_size > 1_000_000, 'Checkpoint is missing or an LFS pointer'
          with Path('dataset/root/gloss.csv').open(encoding='utf-8-sig', newline='') as source:
              assert sum(1 for _ in csv.DictReader(source)) == 400, 'Expected 400 gloss rows'
          PY
      - name: Build inference image
        run: docker build --progress=plain -t vslnet-ci:${{ github.sha }} .
      - name: Run Python regression tests in the image
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests:/app/tests:ro" \
            vslnet-ci:${{ github.sha }} \
            -m unittest discover -s /app/tests -p 'test_*.py' -v
      - name: Smoke test the running HTTP service
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run -d -p 127.0.0.1:8001:8001 vslnet-ci:${{ github.sha }})
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8001/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker logs "$container"
            exit 1
          fi

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
    steps:
      - name: Trigger the configured VSLNet Dokploy Application
        shell: bash
        run: |
          set -euo pipefail
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name"
              exit 1
            fi
          done
          case "$DOKPLOY_URL" in
            https://*) ;;
            *) echo '::error::DOKPLOY_URL must use HTTPS' >&2; exit 1 ;;
          esac
          payload=$(jq -cn --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId:$id}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error --retry 2 --retry-connrefused \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header 'accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload")
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dokploy rejected deployment (HTTP $status)" >&2
            exit 1
          fi
          if [ -s "$response_file" ] && ! jq empty "$response_file" >/dev/null 2>&1; then
            echo '::error::Dokploy returned invalid JSON' >&2
            exit 1
          fi
          if [ -s "$response_file" ] && jq -e 'type == "object" and (has("error") or (.code? == "BAD_REQUEST") or (.code? == "UNAUTHORIZED") or (.code? == "FORBIDDEN") or (.code? == "NOT_FOUND") or (.code? == "INTERNAL_SERVER_ERROR"))' "$response_file" >/dev/null 2>&1; then
            echo '::error::Dokploy returned an error' >&2
            exit 1
          fi
          echo "Dokploy accepted the VSLNet deployment request (HTTP $status); inspect the final deployment status in Dokploy"
